name: Backup Firestore PROD

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bem-feito-prod-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository_id == '1406056807' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: backup-prod
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_ENVIRONMENT: backup-prod
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
      - run: npm ci --no-fund
      - run: node --test tools/backup/firestore-snapshot.test.mjs
      - name: Authenticate with isolated backup identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: bem-feito-prod
          workload_identity_provider: projects/561166235264/locations/global/workloadIdentityPools/github-backup/providers/github
          service_account: github-backup-prod@bem-feito-prod.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Create full private snapshot and verify every chunk
        run: node tools/backup/firestore-snapshot.mjs
