name: TEMP catalog security lock refresh
on:
  push:
    branches: [feat/catalog-bulk-matrix-20261024]
    paths: [.github/workflows/catalog-security-lock-refresh-temp.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
      - run: npm audit fix --package-lock-only --no-fund
      - run: npm ci --no-fund
      - run: npm audit
      - name: Commit resolved security dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): resolve published security advisories in lockfile"
            git push origin HEAD:feat/catalog-bulk-matrix-20261024
          fi
