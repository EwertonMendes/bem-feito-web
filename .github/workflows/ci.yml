name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  deny-untrusted-data-oidc:
    if: github.event_name == 'push' && github.ref != 'refs/heads/master' && github.repository_id == '1406056807'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Confirm this untrusted workflow cannot exchange an administrative credential
        run: node tools/data-admin/deny-untrusted-oidc.mjs
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run security:scan
      - run: npm run test:security
      - run: npm run test:architecture
      - run: npm run test:ci-config
      - run: npm ci --no-fund
      - run: npm run check:data-admin
      - run: npm run test:data-admin
      - run: npm run test:migration
      - run: npm run test:data-admin:emulator
      - run: npm run security:audit
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:transactions
      - name: Prepare DEV artifact metadata
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_SOURCE_PR: ci
        run: npm run deploy:prepare:dev
      - run: npm run build:dev:hosting
      - name: Upload DEV hosting artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-hosting-${{ github.sha }}
          path: dist/bem-feito-web/browser
          if-no-files-found: error
          retention-days: 2
      - run: rm -f public/deployment.json
      - run: npm run build:prod
