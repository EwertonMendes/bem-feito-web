name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  deny-untrusted-data-oidc:
    if: github.event_name == 'push' && github.ref != 'refs/heads/master' && github.repository_id == '1406056807'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Confirm this untrusted workflow cannot exchange an administrative credential
        run: node tools/data-admin/deny-untrusted-oidc.mjs
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run security:scan
      - run: npm run test:security
      - run: npm run test:architecture
      - run: npm run test:ci-config
      - run: npm run test:prod-config
      - run: npm ci --no-fund
      - run: node --test tools/backup/firestore-snapshot.test.mjs
      - run: npm run check:data-admin
      - run: npm run test:data-admin
      - run: npx tsc -p worker/tsconfig.json
      - name: Bundle Cloudflare Worker in dry-run mode
        working-directory: worker
        run: npx --yes wrangler@4.152.0 deploy --dry-run --env dev --outdir /tmp/bem-feito-drive-build
      - run: node --experimental-strip-types --test worker/tests/*.test.mjs
      - run: npm run test:migration
      - run: npm run test:data-admin:emulator
      - run: npm run security:audit
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:transactions
      - name: Prepare DEV artifact metadata
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_SOURCE_PR: ci
        run: npm run deploy:prepare:dev
      - run: npm run build:dev:hosting
      - name: Upload DEV hosting artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-hosting-${{ github.sha }}
          path: dist/bem-feito-web/browser
          if-no-files-found: error
          retention-days: 2
      - run: rm -f public/deployment.json
      - run: npm run build:prod
      - name: Generate synthetic PROD resources and metadata (CI-only fixture)
        run: node tools/tests/generate-prod-fixture.mjs
      - name: Compile real generated PROD configuration
        run: npm run build:prod
      - name: Assert synthetic PROD bundle cannot contain DEV resource IDs
        run: node tools/tests/verify-prod-fixture.mjs
      - name: Verify PROD Worker build path without cloud authentication
        working-directory: worker
        run: npx --yes wrangler@4.152.0 deploy --dry-run --config wrangler.generated.prod.jsonc --env prod --outdir /tmp/bem-feito-drive-prod-fixture
      - run: rm -f public/deployment.json worker/wrangler.generated.prod.jsonc
