name: Firebase data administration

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Request PR number
        required: true
      path:
        description: operations/requests/name.json
        required: true
      sha:
        description: Exact request PR head SHA (40 hex)
        required: true
      mode:
        type: choice
        options: [preview, apply]
        required: true
        default: preview
      request_hash:
        description: SHA-256 from preview (apply only)
        required: false
      plan_hash:
        description: Immutable plan SHA-256 from preview (apply only)
        required: false

permissions:
  contents: read

concurrency:
  group: firebase-data-administration
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.repository_id == '1406056807' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.pull_request && startsWith(github.event.comment.body, '/data-admin ')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      environment: ${{ steps.gate.outputs.environment }}
      migration: ${{ steps.gate.outputs.migration }}
      deployment_sha: ${{ steps.gate.outputs.deployment_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.3
      - name: Authorize requester, protected executor and immutable JSON
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types tools/data-admin/gate.ts

  isolated-e2e:
    needs: gate
    if: needs.gate.outputs.migration == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # PR application tests run with no OIDC, cloud credentials, write token or caches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.deployment_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.3
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run test:transactions
      - run: npm run test:rules

  operation:
    needs: [gate, isolated-e2e]
    if: >-
      always() && needs.gate.result == 'success' &&
      (needs.isolated-e2e.result == 'success' || needs.isolated-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ needs.gate.outputs.environment }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.3
      - run: npm ci --ignore-scripts --no-fund
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: needs.gate.outputs.migration == 'true'
        with:
          python-version: '3.12'
      - if: needs.gate.outputs.migration == 'true'
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Recheck authorization after environment approval, before OIDC
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types tools/data-admin/gate.ts
      - name: Obtain short-lived, environment-specific identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.gate.outputs.project }}
          workload_identity_provider: ${{ steps.gate.outputs.provider }}
          service_account: ${{ steps.gate.outputs.account }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Preview or execute exact approved plan
        run: node --experimental-strip-types tools/data-admin/cli.ts
      - name: Remove private local source and authorization files
        if: always()
        shell: bash
        run: |
          rm -rf tools/data-admin/.private tools/migration/.private
          rm -f tools/migration/legacy-raw.json tools/migration/migration-data.json
