name: Deploy Drive Worker DEV

on:
  workflow_dispatch:
  push:
    branches: [feat/drive-offline-oauth-worker-dev]

permissions:
  contents: read

concurrency:
  group: bem-feito-drive-worker-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'EwertonMendes/bem-feito-web' && github.actor == github.repository_owner && (github.ref == 'refs/heads/feat/drive-offline-oauth-worker-dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://bem-feito-drive-dev.ewertonmendes9.workers.dev/health
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
      - run: npm ci --no-fund
      - run: npx tsc -p worker/tsconfig.json
      - run: node --experimental-strip-types --test worker/tests/security.test.mjs
      - name: Deploy existing DEV Worker (does not apply D1 migrations)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.45.0 deploy --env dev --keep-vars
      - name: Verify Worker response
        run: |
          node - <<'NODE'
          const url = 'https://bem-feito-drive-dev.ewertonmendes9.workers.dev/health';
          for (let i=0;i<8;i++) {
            try {
              const response=await fetch(url,{signal:AbortSignal.timeout(10000)});
              const data=await response.json();
              if (response.ok && data.status==='ok' && data.environment==='dev') process.exit(0);
            } catch {}
            await new Promise(resolve=>setTimeout(resolve,1500));
          }
          process.exit(1);
          NODE
