name: Deploy Drive Worker PROD (manual promotion)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact homologated master commit SHA (40 lowercase hex)"
        type: string
        required: true

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: bem-feito-prod-release
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository_id == '1406056807' && github.ref == 'refs/heads/master' && github.actor == 'EwertonMendes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
      - name: Confirm exact CI-approved commit has been published in DEV
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: node tools/deploy/verify-prod-release.mjs

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ vars.PROD_WORKER_ORIGIN }}/health
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      PROD_FIREBASE_PROJECT_ID: ${{ vars.PROD_FIREBASE_PROJECT_ID }}
      PROD_FRONTEND_ORIGIN: ${{ vars.PROD_FRONTEND_ORIGIN }}
      PROD_APPROVED_CUSTOM_ORIGIN: ${{ vars.PROD_APPROVED_CUSTOM_ORIGIN }}
      PROD_WORKER_ORIGIN: ${{ vars.PROD_WORKER_ORIGIN }}
      PROD_GOOGLE_OAUTH_SERVER_CLIENT_ID: ${{ vars.PROD_GOOGLE_OAUTH_SERVER_CLIENT_ID }}
      PROD_OAUTH_REDIRECT_URI: ${{ vars.PROD_OAUTH_REDIRECT_URI }}
      PROD_WORKER_NAME: ${{ vars.PROD_WORKER_NAME }}
      PROD_D1_DATABASE_NAME: ${{ vars.PROD_D1_DATABASE_NAME }}
      PROD_D1_DATABASE_ID: ${{ vars.PROD_D1_DATABASE_ID }}
      PROD_TOKEN_KEY_VERSION: ${{ vars.PROD_TOKEN_KEY_VERSION }}
      PROD_OAUTH_ENABLED: ${{ vars.PROD_OAUTH_ENABLED || 'false' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
      - name: Reauthorize release after human PROD approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/deploy/verify-prod-release.mjs
      - run: npm ci --no-fund
      - run: npx tsc -p worker/tsconfig.json
      - run: node --experimental-strip-types --test worker/tests/*.test.mjs
      - name: Generate strict PROD Wrangler configuration
        run: node tools/deploy/prepare-prod-worker-config.mjs
      - name: Validate Worker bundle without publishing
        working-directory: worker
        run: |
          npx --yes wrangler@4.152.0 deploy --dry-run \
            --config wrangler.generated.prod.jsonc --env prod --outdir /tmp/bem-feito-drive-prod-build
      - name: Publish tagged Worker version (preserve Cloudflare-managed secrets)
        working-directory: worker
        run: |
          TAG="${{ inputs.release_sha }}"
          TAG="bf-prod-$(printf '%s' "$TAG" | cut -c1-12)"
          npx --yes wrangler@4.152.0 versions upload --config wrangler.generated.prod.jsonc \
            --env prod --tag "$TAG" --message "Bem Feito Drive PROD ${{ inputs.release_sha }}"
          npx --yes wrangler@4.152.0 versions deploy --config wrangler.generated.prod.jsonc \
            --env prod --version-tag "$TAG" --yes
      - name: Verify Worker is responding from PROD environment
        run: |
          node - <<'NODE'
          const base = process.env.PROD_WORKER_ORIGIN;
          for (let attempt = 0; attempt < 8; attempt++) {
            try {
              const response = await fetch(base + '/health', {signal:AbortSignal.timeout(10000)});
              const body = await response.json();
              if (response.ok && body.status === 'ok' && body.environment === 'production') {
                console.log('PROD Worker is live and isolated.');
                process.exit(0);
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 1500));
          }
          process.exit(1);
          NODE
