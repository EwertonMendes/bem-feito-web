name: Temporary E2E v1.1 (emulators)
on:
  push:
    branches:
      - feat/web-1-1-vendas-busca-relatorios
permissions:
  contents: read
concurrency:
  group: temporary-e2e-v1-1
  cancel-in-progress: true
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-fund
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Patch only the CI worktree to use emulators and login without third-party OAuth
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const envFile='src/environments/environment.ts';
          let env=readFileSync(envFile,'utf8');
          if(!env.includes('useEmulators: false')||!env.includes('projectId: "bem-feito-dev"'))throw Error('Environment anchors changed');
          env=env.replace('useEmulators: false','useEmulators: true')
            .replace('projectId: "bem-feito-dev"','projectId: "demo-bem-feito"')
            .replace('enabled: true','enabled: false');
          writeFileSync(envFile,env);
          const path='src/app/core/auth/auth.service.ts';
          let src=readFileSync(path,'utf8');
          if(!src.includes('    const provider = new GoogleAuthProvider();'))throw Error('Login anchor changed');
          src=src.replace('  signInWithPopup,','  signInWithPopup,\n  signInWithEmailAndPassword,');
          src=src.replace("import { UserProfile } from '../../domain/models/common.model';",
            "import { UserProfile } from '../../domain/models/common.model';\nimport { environment } from '../../../environments/environment';");
          src=src.replace('    const provider = new GoogleAuthProvider();',
            "    if (environment.useEmulators) {\n      try {\n        const result = await signInWithEmailAndPassword(this.auth,'e2e@example.test','E2ePassword!2026');\n        await this.finishLogin(result.user);\n      } catch (error) { this.errorState.set(String(error)); }\n      finally { this.busyState.set(false); }\n      return;\n    }\n    const provider = new GoogleAuthProvider();");
          writeFileSync(path,src);
          NODE
      - name: Run desktop and mobile E2E against isolated Firebase emulators
        run: npx --yes --package firebase-tools@15.32.1 firebase emulators:exec --only auth,firestore --project demo-bem-feito "bash tools/e2e-temp/runner.sh"
      - name: Upload screenshots of real UI at all tested breakpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-e2e-screenshots
          path: tools/e2e-temp/screenshots
          retention-days: 3
          if-no-files-found: ignore
