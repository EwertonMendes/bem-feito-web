name: TEMP - Migration snapshot preflight
on:
  push:
    branches: [feat/operacao-financeiro-migracao-20261009]
    paths:
      - .github/workflows/migration-dev-temporary.yml
      - tools/migration/fetch-sheets.mjs
permissions:
  contents: read
  id-token: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --no-fund
      - name: Authenticate to private snapshot through workload identity
        uses: google-github-actions/auth@v3
        with:
          project_id: bem-feito-dev
          workload_identity_provider: projects/312978463343/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deploy@bem-feito-dev.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify private Google Sheets read permissions (no writes)
        env:
          MIGRATION_SNAPSHOT_ID: 1aPBxplXEK4-6YkR5zNGa3E9uTTUf7rrbho9JcvmfUX0
        run: node tools/migration/fetch-sheets.mjs --preflight
      - name: Read and validate legacy data without importing
        env:
          MIGRATION_SNAPSHOT_ID: 1aPBxplXEK4-6YkR5zNGa3E9uTTUf7rrbho9JcvmfUX0
        run: |
          node tools/migration/fetch-sheets.mjs
          node tools/migration/normalize-legacy.mjs
          node tools/migration/validate-export.mjs
