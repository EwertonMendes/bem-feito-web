name: TEMP - DEV migration trusted preflight or replacement
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

concurrency:
  group: bem-feito-dev
  cancel-in-progress: false

jobs:
  trusted-migration:
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.body == '/migration-dev-check' ||
       github.event.comment.body == '/migration-dev-replace') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Resolve trusted owner branch, exact commit and passed CI
        uses: actions/github-script@v9
        id: source
        with:
          script: |
            const {owner,repo}=context.repo;
            const {data:pull}=await github.rest.pulls.get({owner,repo,pull_number:context.issue.number});
            if(pull.state!=='open'||pull.user.login!==owner||
               pull.head.repo?.full_name!==`${owner}/${repo}`||
               pull.head.ref!=='feat/operacao-financeiro-migracao-20261009'){
              core.setFailed('Untrusted migration source');return;
            }
            const {data:runs}=await github.rest.actions.listWorkflowRuns({
              owner,repo,workflow_id:'ci.yml',head_sha:pull.head.sha,
              event:'push',status:'success',per_page:10
            });
            if(!runs.workflow_runs.some(run=>run.head_sha===pull.head.sha && run.conclusion==='success')){
              core.setFailed('CI not passed for exact PR SHA '+pull.head.sha);return;
            }
            core.setOutput('sha',pull.head.sha);
            core.setOutput('replace',context.payload.comment.body==='/migration-dev-replace'?'true':'false');

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        if: steps.source.outputs.replace == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - run: npm ci --no-fund

      - name: Authenticate with DEV-only deploy identity
        uses: google-github-actions/auth@v3
        with:
          project_id: bem-feito-dev
          workload_identity_provider: projects/312978463343/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deploy@bem-feito-dev.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Read fresh private source and reconcile all data
        env:
          MIGRATION_SNAPSHOT_ID: 1SadA_IgdPX9Y718AgwixVTAqkNU5bIu67urOvoqz8yM
        run: |
          node tools/migration/fetch-sheets.mjs --preflight
          node tools/migration/fetch-sheets.mjs
          node tools/migration/normalize-legacy.mjs
          node tools/migration/reconcile-legacy.mjs
          node tools/migration/validate-export.mjs

      - name: Require the exact reviewed commit already published in DEV
        if: steps.source.outputs.replace == 'true'
        env:
          DEPLOY_COMMIT: ${{ steps.source.outputs.sha }}
        run: npm run deploy:verify:dev

      - name: Backup test data, replace DEV from Sheets and verify all records
        if: steps.source.outputs.replace == 'true'
        env:
          FIREBASE_PROJECT_ID: bem-feito-dev
          DEV_REPLACE_APPROVED: confirmed-by-owner-comment
        run: node tools/migration/replace-dev.mjs

      - name: Confirm atomic import remains reproducible
        if: steps.source.outputs.replace == 'true'
        env:
          FIREBASE_PROJECT_ID: bem-feito-dev
        run: node tools/migration/verify-firestore.mjs --exact-counts

      - name: Temporary E2E - sales, manufacturing, purchases and cancellation
        if: steps.source.outputs.replace == 'true'
        run: npm run test:transactions

      - name: Temporary E2E - Firestore authorization rules
        if: steps.source.outputs.replace == 'true'
        run: npm run test:rules

      - name: Confirm emulator tests left no records in DEV
        if: steps.source.outputs.replace == 'true'
        run: |
          echo "All E2E writes ran only against ephemeral demo-bem-feito emulator."
          echo "Firestore DEV contains only migrated operational data and protected rollback archive."
