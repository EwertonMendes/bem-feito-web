name: Refresh dependency lockfile

on:
  push:
    branches:
      - refactor/shared-components-architecture

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-components-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:dev:hosting
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:refactor/shared-components-architecture
