<section class="image-upload" [class.disabled]="disabled()">
  <strong class="label">{{ label() }}</strong>

  <input
    #nativeInput
    class="native-input"
    type="file"
    [accept]="accept()"
    [disabled]="disabled()"
    (change)="onFileInput($event)"
  />

  <div
    class="dropzone"
    [class.dragging]="dragging()"
    [class.has-image]="!!file() || (hasCurrent() && !removeCurrent())"
    [class.removing]="removeCurrent() && !file()"
    role="button"
    tabindex="0"
    [attr.aria-disabled]="disabled()"
    aria-label="Selecionar imagem"
    (click)="openPicker()"
    (keydown.enter)="openPicker()"
    (keydown.space)="$event.preventDefault(); openPicker()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    @if (previewUrl()) {
      <div class="preview">
        <img [src]="previewUrl()!" alt="Prévia da imagem selecionada" />
      </div>
      <button
        type="button"
        class="image-action"
        aria-label="Remover imagem selecionada"
        title="Remover seleção"
        (click)="clearSelection($event)"
      >
        <bf-icon name="close" />
      </button>
    } @else if (hasCurrent() && !removeCurrent()) {
      <div class="preview current">
        <ng-content select="[bfImageUploadCurrent]" />
      </div>
      <button
        type="button"
        class="image-action danger"
        aria-label="Remover imagem atual"
        title="Remover imagem"
        (click)="removeExisting($event)"
      >
        <bf-icon name="trash" />
      </button>
    } @else {
      <div class="empty-state">
        <span class="upload-icon"><bf-icon name="upload" /></span>
        <strong>{{ removeCurrent() ? 'Imagem será removida ao salvar' : 'Clique ou arraste uma imagem' }}</strong>
      </div>

      @if (removeCurrent()) {
        <button
          type="button"
          class="image-action"
          aria-label="Desfazer remoção da imagem"
          title="Desfazer remoção"
          (click)="restoreExisting($event)"
        >
          <bf-icon name="arrow-right" />
        </button>
      }
    }
  </div>

  @if (validationMessage()) {
    <span class="validation"><bf-icon name="alert" /> {{ validationMessage() }}</span>
  }
</section>
