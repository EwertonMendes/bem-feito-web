<div
  class="control"
  [class.invalid]="invalid()"
  [class.disabled]="disabled()"
  [class.currency]="kind()==='currency'"
>
  @if (kind()==='currency') { <span class="affix prefix">R$</span> }
  <input
    #native
    type="text"
    autocomplete="off"
    [attr.inputmode]="inputMode()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-invalid]="invalid()"
    [required]="required()"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    [value]="displayValue()"
    (focus)="onFocus()"
    (input)="onInput($event)"
    (blur)="onBlur()"
    (keydown)="onKeydown($event)"
  />
  @if (suffix()) { <span class="affix suffix">{{ suffix() }}</span> }
</div>
