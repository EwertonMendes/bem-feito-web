<button
  #trigger
  class="trigger"
  type="button"
  role="combobox"
  aria-haspopup="listbox"
  [class.open]="open()"
  [class.compact]="compact()"
  [class.descriptive]="descriptive()"
  [class.placeholder]="!selectedOption() || selectedOption()?.value === ''"
  [class.invalid]="invalid()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-expanded]="open()"
  [attr.aria-invalid]="invalid()"
  [attr.aria-required]="required()"
  [attr.aria-controls]="listboxId"
  [attr.aria-activedescendant]="open() && activeIndex() >= 0 ? selectId + '-option-' + activeIndex() : null"
  [disabled]="disabled()"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
  (focusout)="onFocusOut($event)"
>
  <span class="selection">
    @if (selectedOption(); as selected) {
      @if (imageTemplate() && selected.value) {
        <span class="media image"><ng-container [ngTemplateOutlet]="imageTemplate()" [ngTemplateOutletContext]="{ $implicit: selected }" /></span>
      } @else if (selected.imageSrc) {
        <span class="media image"><img [src]="selected.imageSrc" [alt]="selected.imageAlt || ''" /></span>
      } @else if (selected.icon) {
        <span class="media icon"><bf-icon [name]="selected.icon" /></span>
      }
      <span class="selection-copy">
        <strong>{{ selected.label }}</strong>
        @if (selected.description && !compact()) { <small>{{ selected.description }}</small> }
      </span>
    } @else {
      <span class="selection-copy"><strong>{{ placeholder() }}</strong></span>
    }
  </span>
  <bf-icon class="chevron" name="chevron-right" />
</button>

<div
  #menu
  class="menu"
  popover="manual"

  [class.compact]="compact()"
  [class.descriptive]="descriptive()"
>
  @if (searchable) {
    <div class="search-field">
      <bf-icon name="search" />
      <input
        #searchInput
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="Buscar opção..."
        [attr.aria-label]="'Buscar em ' + ariaLabel()"
        role="combobox"
        aria-autocomplete="list"
        aria-haspopup="listbox"
        [attr.aria-controls]="listboxId"
        [attr.aria-expanded]="open()"
        [attr.aria-activedescendant]="activeIndex() >= 0 ? selectId + '-option-' + activeIndex() : null"
        [value]="searchQuery()"
        (input)="onSearchInput(searchInput.value)"
        (keydown)="onSearchKeydown($event)"
        (focusout)="onFocusOut($event)"
      />
      @if (searchQuery()) {
        <button type="button" class="clear-search" aria-label="Limpar busca" (click)="onSearchInput(''); searchInput.focus()">
          <bf-icon name="close" />
        </button>
      }
    </div>
  }
  <div class="options" role="listbox" [id]="listboxId" [attr.aria-label]="ariaLabel()">
  @for (option of filteredOptions(); track option.value; let i = $index) {
    <button
      class="option"
      [class.has-media]="!!((imageTemplate() && option.value) || option.imageSrc || option.icon)"
      type="button"
      role="option"
      tabindex="-1"
      [id]="selectId + '-option-' + i"
      [class.selected]="option.value === value()"
      [class.active]="i === activeIndex()"
      [attr.data-active]="i === activeIndex()"
      [attr.aria-selected]="option.value === value()"
      [disabled]="option.disabled"
      (pointerdown)="$event.pointerType === 'mouse' && $event.preventDefault()"
      (mouseenter)="!option.disabled && activeIndex.set(i)"
      (click)="select(option, i)"
    >
      @if (imageTemplate() && option.value) {
        <span class="media image"><ng-container [ngTemplateOutlet]="imageTemplate()" [ngTemplateOutletContext]="{ $implicit: option }" /></span>
      } @else if (option.imageSrc) {
        <span class="media image"><img [src]="option.imageSrc" [alt]="option.imageAlt || ''" /></span>
      } @else if (option.icon) {
        <span class="media icon"><bf-icon [name]="option.icon" /></span>
      }
      <span class="option-copy">
        <strong>{{ option.label }}</strong>
        @if (option.description) { <small>{{ option.description }}</small> }
      </span>
      @if (option.value === value()) {
        <span class="selected-mark"><bf-icon name="tick" /></span>
      }
    </button>
  } @empty {
    <div class="empty">{{ searchQuery() ? 'Nenhum resultado para a busca.' : 'Nenhuma opção disponível.' }}</div>
  }
  </div>
</div>
